[package]
name = "bt-core"
description = "`bt`'s core: the areas and their lanes, selector resolution, the suite catalog, Bazel test runs, BEP and test.xml reading."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[lints]
workspace = true

# Inline rather than `.workspace = true`: the Air UI-lane workspace links this crate through a path dependency, and
# rules_rs reads the `[dependencies]` of such a crate without its workspace. See `[workspace.dependencies]`.
[dependencies]
bt-junit = { path = "../bt-junit" }
percent-encoding = "2.3.2"
regex = "1.13.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
strsim = "0.11.1"
tempfile = "3.27.0"

[dev-dependencies]
pretty_assertions.workspace = true
