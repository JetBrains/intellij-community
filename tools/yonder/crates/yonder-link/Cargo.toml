# Inline rather than `.workspace = true`: BT links this crate through the path dependency `yonder-client`, and rules_rs
# reads the `[package]` and `[dependencies]` of such a crate without its workspace. Keep the values equal to
# `[workspace.package]` and `[workspace.dependencies]`.
[package]
name = "yonder-link"
description = "The link of yonder: the identity files, the TLS channel over TCP, and the protocol of the client and the agent."
version = "0.1.0"
edition = "2024"
rust-version = "1.93"
publish = false
license = "Apache-2.0"

[lints]
workspace = true

[dependencies]
rcgen = { version = "0.14.5", default-features = false, features = ["ring"] }
ring = "0.17.14"
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"

[dev-dependencies]
pretty_assertions.workspace = true
tempfile.workspace = true
