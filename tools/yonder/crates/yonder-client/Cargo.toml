# Inline rather than `.workspace = true`: BT links this crate through a path dependency, and rules_rs reads the
# `[package]` and `[dependencies]` of such a crate without its workspace. Keep the values equal to
# `[workspace.package]` and `[workspace.dependencies]`.
[package]
name = "yonder-client"
description = "The client of yonder: the host files, the address choice, and the operations of the protocol, for `yonder` and `bt --host`."
version = "0.1.0"
edition = "2024"
rust-version = "1.93"
publish = false
license = "Apache-2.0"

[lints]
workspace = true

[dependencies]
ctrlc = "3.5.2"
refusal = { path = "../../../bt/crates/refusal" }
ring = "0.17.14"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
yonder-link = { path = "../yonder-link" }

[dev-dependencies]
pretty_assertions.workspace = true
tempfile.workspace = true
