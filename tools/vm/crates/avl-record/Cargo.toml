[package]
name = "avl-record"
description = "The recorder a lane starts, `air-trace-record`: the protocol state machine, capture, stills, video, the bundle writer."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[[bin]]
name = "air-trace-record"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
anyhow.workspace = true
avl-bridge.workspace = true
avl-trace.workspace = true
crossbeam-channel.workspace = true
image-webp.workspace = true
jiff.workspace = true
png.workspace = true
serde_json.workspace = true
signal-hook.workspace = true
xxhash-rust.workspace = true

[target.'cfg(unix)'.dependencies]
# The video encoder and the encoder of the lossy stills are built where a raw video can be recorded or its round trip
# tested. A scenario without a video takes lossless stills. Windows has no X11 source and is spared the C and C++
# builds.
avif-serialize.workspace = true
avl-aom-sys.workspace = true
openh264.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
libc.workspace = true
x11rb.workspace = true

[dev-dependencies]
avl-testkit.workspace = true
expect-test.workspace = true
pretty_assertions.workspace = true
tempfile.workspace = true
