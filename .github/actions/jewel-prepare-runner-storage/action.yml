name: Prepare Runner Storage
description: >
  Removes pre-installed toolchains that Jewel CI does not use. A hosted runner does not have
  enough disk space to compile every community module without this. It also expands the swap pool.

runs:
  using: composite
  steps:
    - name: Free disk space
      shell: bash
      # language=bash
      run: |
        echo "Disk space before cleanup:"
        df -h /
        # Pre-installed toolchains Jewel CI does not use.
        sudo rm -rf \
          /usr/share/dotnet \
          /usr/share/swift \
          /usr/share/miniconda \
          /usr/local/lib/android \
          /usr/local/share/boost \
          /usr/local/share/powershell \
          /usr/local/share/chromium \
          /usr/local/lib/node_modules \
          /opt/ghc \
          /opt/hostedtoolcache/CodeQL \
          /opt/hostedtoolcache/Ruby \
          /opt/hostedtoolcache/PyPy \
          /opt/hostedtoolcache/go \
          /opt/microsoft \
          /opt/google \
          /imagegeneration \
          /var/cache/apt/archives
        sudo apt-get -y clean
        docker image prune --all --force || true
        docker builder prune --all --force || true
        echo "Disk space after cleanup:"
        df -h /

    - name: Expand swap
      shell: bash
      # language=bash
      run: |
        # Bazel's JVM workers may hit OOM (exit 137) with the default 16 GB RAM and 4 GB swap.
        # /mnt on hosted runners has ~70 GB free, so move swap there and grow it.
        sudo swapoff -a || true
        sudo rm -f /mnt/swapfile /swapfile
        sudo fallocate -l 30G /mnt/swapfile
        sudo chmod 600 /mnt/swapfile
        sudo mkswap /mnt/swapfile
        sudo swapon /mnt/swapfile
        free -h