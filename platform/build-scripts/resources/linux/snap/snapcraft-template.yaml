# see platform/build-scripts/.../LinuxDistributionBuilder.kt

name: $NAME$
version: '$VERSION$'
summary: |-
  $SUMMARY$
description: |-
  $DESCRIPTION$
grade: $GRADE$
confinement: classic
base: core22
compression: lzo
architectures:
  - build-on: [amd64, arm64]
    build-for: amd64
  - build-on: [amd64, arm64]
    build-for: arm64

apps:
  $NAME$:
    command: $LAUNCHER$

parts:
  ide:
    plugin: dump
    source: dist.tar.gz
    build-attributes: [no-patchelf]
