notification.jcef.gpucrash.title=Too many restarts of the GPU process (JCEF)
notification.jcef.gpucrash.message=<html>GPU process of embedded browser (JCEF) restarts too many times and seems unstable. \
  Please restart JCEF with verbose logging (and/or with disabled GPU acceleration), collect IDE logs and attach them to YouTrack issue \
  https://youtrack.jetbrains.com/issue/JBR-10025/Intermittent-crashes-of-jcef-GPU-process. It will help us to investigate this problem.</html>
notification.jcef.gpucrash.action.restart_verbose=Restart JCEF with verbose Logging
notification.jcef.gpucrash.action.restart_verbose_and_disabled_GPU=Restart JCEF with disabled GPU and verbose logging

notification.jcef.disconnect.title=JCEF process was disconnected
notification.jcef.disconnect.message_with_silent_logging=<html>The connection with JCEF process was broken. \
  Please restart JCEF with verbose logging, then reopen UI-components with browser, collect IDE logs and attach them to YouTrack issue \
  https://youtrack.jetbrains.com/issue/JBR-10027/Intermittent-crashes-of-cefserver. It will help us to investigate this problem.</html>
notification.jcef.disconnect.message_with_verbose_logging=<html>The connection with JCEF process was broken. \
  Please collect IDE logs and attach them to YouTrack issue \
  https://youtrack.jetbrains.com/issue/JBR-10027/Intermittent-crashes-of-cefserver. It will help us to investigate this problem.</html>
