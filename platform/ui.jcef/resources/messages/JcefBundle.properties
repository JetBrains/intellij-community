notification.jcef.startup_test_failed.title=JCEF initial health check was failed
notification.jcef.startup_test_failed.message_with_silent_logging=<html>The initial health check of JCEF was failed with an error:<br>{0}<br>\
  This is an unusual problem, probably it is connected with specific hardware or environment. \
  Please restart JCEF with verbose logging, collect IDE logs and attach them to the YouTrack issue https://youtrack.jetbrains.com/issue/JBR-10024/Intermittent-failures-of-jcef-StartupTest. \
  It will help us to investigate this problem.</html>
notification.jcef.startup_test_failed.message_with_silent_logging_with_GPU_crashes=<html>The initial health check of JCEF was failed with an error:<br>{0}<br>\
  GPU process crashes were detected. This is an unusual problem, probably it is connected with specific hardware or environment. \
  Please restart JCEF with disabled GPU acceleration. If the problem doesn't disappear, please restart JCEF with disabled GPU acceleration and verbose logging, collect IDE logs and attach them to the YouTrack issue https://youtrack.jetbrains.com/issue/JBR-10024/Intermittent-failures-of-jcef-StartupTest. \
  It will help us to investigate this problem.</html>
notification.jcef.startup_test_failed.message_with_verbose_logging=<html>The JCEF startup failed with an error:<br>{0}<br>\
  Please collect IDE logs and attach them to the YouTrack issue https://youtrack.jetbrains.com/issue/JBR-10024/Intermittent-failures-of-jcef-StartupTest. </html>
notification.jcef.startup_test_failed.message_with_verbose_logging_print_log_path=<html>The JCEF startup failed with an error:<br>{0}<br>\
  Please attach JCEF log '{1}' to the YouTrack issue https://youtrack.jetbrains.com/issue/JBR-10024/Intermittent-failures-of-jcef-StartupTest. </html>
