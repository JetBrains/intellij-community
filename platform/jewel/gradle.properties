org.gradle.jvmargs=-Xmx2G
# Disable adding the Kotlin Stdlib by default to avoid issues with IJ plugins
# See https://jb.gg/intellij-platform-kotlin-stdlib
kotlin.stdlib.default.dependency=false

org.jetbrains.intellij.platform.buildFeature.useBinaryReleases=false
org.jetbrains.intellij.platform.intellijPlatformIdesCacheEnabled=true
# Keep the bundled IDE plugins off the test classpath. Jewel tests declare the plugins they need.
# See https://github.com/JetBrains/intellij-platform-gradle-plugin/issues/2261
org.jetbrains.intellij.platform.testIdeBundledPluginsClasspathEnabled=false
org.jetbrains.dokka.experimental.gradle.pluginMode=V2Enabled
org.jetbrains.dokka.experimental.gradle.pluginMode.noWarn=true

jdk.level=25
jewel.release.version=0.43.0
