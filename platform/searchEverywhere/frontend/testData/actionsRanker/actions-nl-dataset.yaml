# The evaluation dataset of natural-language action search in the Actions tab of Search Everywhere. See IJPL-259052.
# `actions` holds 300 actions of the IDE. They are the most popular actions by the share of users in
# community/platform/statistics/resources/statistics/actionsUsagesV4.csv, without groups and weak search targets.
# Less popular actions replace the removed ones. `name` and `description` are the template texts of the action.
# `requests` holds short natural-language requests that an LLM wrote, 5 for each action.
# Another LLM pass chose `expected`: the 1-3 actions of `actions` that solve the request, the best first. That pass did not see `source`.
# `source` is the action for which the request was written. It can be absent from `expected`.
