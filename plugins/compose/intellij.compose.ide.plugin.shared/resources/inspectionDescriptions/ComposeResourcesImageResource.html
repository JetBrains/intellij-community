<p>
  <code>imageResource</code> loads drawable resources as an
  <code>ImageBitmap</code> rasterized image.
</p>
<p>
  For XML vector drawable resources, use <code>painterResource</code> instead.
</p>
<p>
  SVG resources are not supported on Android, and this will lead to runtime errors for your application.
</p>
</body>
