  - load_path: "META-INF/analysis-api/analysis-api-impl-base.xml"
    module: "intellij.libraries.kotlinc.analysis.api.impl.base"
    library: "kotlinc.analysis-api-impl-base"
  - load_path: "META-INF/extensions/compiler.xml"
    module: "intellij.libraries.kotlinc.kotlin.compiler.common"
    library: "kotlinc.kotlin-compiler-common"
  - load_path: "META-INF/analysis-api/analysis-api-platform-interface.xml"
    module: "intellij.libraries.kotlinc.analysis.api.platform.interface"
    library: "kotlinc.analysis-api-platform-interface"
  - load_path: "META-INF/analysis-api/low-level-api-fir.xml"
