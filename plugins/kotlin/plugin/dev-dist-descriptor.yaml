#
# What this plugin's dev-distribution descriptor patch needs that the convention does not give.
#
# `dev_dist_plugin_descriptor` patches the plugin's `META-INF/plugin.xml` the way a dev-distribution assembly
# does, and the JPS-to-Bazel converter emits that target into this plugin's own `BUILD.bazel`. The converter
# derives the plugin's own descriptor, the descriptor of every content module the plugin's `<content>` names,
# the plugin directory and the main jar name. This file is the remainder.
#
# So a plugin with no such file is pure convention. This file exists only for a plugin that reads a descriptor
# through an `xi:include`, or whose `PluginLayout` states a deviation.
#
# Every path is project-relative, and no row is a Bazel label. The converter resolves a path to a label
# itself, which is what lets the community half decide alone. A path outside `community/` is a path a
# community package cannot name, and the community half then emits no section for this plugin.
#
# One section per (plugin, layout variant), keyed `<main module>/<variant>` where the plugin has a variant. A
# deviation is a fact about one variant and not about the plugin: two variants state different markers.
"intellij.kotlin.plugin":
  # Every descriptor an `xi:include` of this plugin's closure reaches, as the load path a resolver asks
  # for and the file that answers it.
  descriptors:
  - load_path: "META-INF/KotlinCommonNativeDebugger.xml"
    path: "mobile-ide/native-debugger/resources/META-INF/KotlinCommonNativeDebugger.xml"
  - load_path: "META-INF/KotlinIdeaNativeDebugger.xml"
    path: "plugins/kotlin/ultimate-native/resources/META-INF/KotlinIdeaNativeDebugger.xml"
  - load_path: "META-INF/KotlinNonCidrDebugger.xml"
    path: "mobile-ide/native-debugger/resources/META-INF/KotlinNonCidrDebugger.xml"
  # A descriptor no production source root holds, which a library jar answers instead. The load path is
  # also the zip entry. The two names are what the converter looks the library up by. No jar is named
  # here, because a jar file name carries the artifact version.
  library_descriptors:
  - load_path: "META-INF/analysis-api/analysis-api-fir.xml"
