<html>
<title>Command imports maven project</title>
<body>
<p>
  Simulate invocation of reimport of maven project.
</p>
<p>
  Syntax: %importMavenProject [full|incremental]
</p>
<p>
  The argument incremental syncs an already imported project incrementally. The default is full.
</p>
<p>
  Example: %importMavenProject incremental
</p>
</body>
</html>
