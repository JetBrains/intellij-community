<body>
<p>Reports a paragraph that starts with a <code>#</code> header marker without a space after it. Markdown renders such a line as plain text, not as a header.</p>
<p><b>Example:</b></p>
<pre><code>#Header</code></pre>
<p>After applying the quick fix:</p>
<pre><code># Header</code></pre>
</body>
