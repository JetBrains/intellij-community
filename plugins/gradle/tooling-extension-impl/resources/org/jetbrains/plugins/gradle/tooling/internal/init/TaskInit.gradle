//file:noinspection GrPackage

import com.intellij.gradle.toolingExtension.impl.initScript.util.GradleLifecycleUtil

//noinspection GrUnresolvedAccess
String projectPath = PROJECT_PATH
//noinspection GrUnresolvedAccess
String taskName = TASK_NAME
//noinspection GrUnresolvedAccess
Class<?> taskType = TASK_TYPE

GradleLifecycleUtil.afterProject(gradle) { Project project ->
  if (project.path == projectPath || (':' + project.rootProject.projectDir.name + project.path) == projectPath) {
    def overwrite = project.tasks.findByName(taskName) != null
    project.tasks.create(name: taskName, overwrite: overwrite, type: taskType) {
      //noinspection GrUnresolvedAccess
      TASK_CONFIGURATION
    }
  }
}
