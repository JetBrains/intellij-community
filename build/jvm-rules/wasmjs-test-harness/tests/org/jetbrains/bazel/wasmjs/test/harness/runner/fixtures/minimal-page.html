<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>wasmjs_test</title>
</head>
<body>
<script>
  globalThis.addEventListener("error", (event) => {
    console.error(`wasmjs_test page error: ${event.message}`);
  });
  globalThis.addEventListener("unhandledrejection", (event) => {
    console.error(`wasmjs_test page error: ${event.reason}`);
  });
</script>
<script src="/_harness/mocha.js"></script>
<script>
  const parameters = new URLSearchParams(window.location.search);
  const includes = parameters.getAll("include");
  window.kotlinTestBrowserRunner = {
    kotlinTestCliArguments: includes.length === 0 ? [] : ["--include", includes.join(",")],
    reporterOptions: { Base: Mocha.reporters.Base },
    mochaSetupOptions: { timeout: 0, bail: parameters.has("failFast") },
    testsFinishedMarker: "wasmjs_test: mocha completed the run",
    onComplete: () => setTimeout(() => console.log("KOTLIN-TEST-FINISHED"), 0),
  };
</script>
<script src="/_harness/kotlin-test-mocha-browser-runner.js"></script>
<script type="module">
  const awaitedExport = (module, path, member) => {
    if (!(member in module)) {
      throw new Error(`awaited import ${path} has no export '${member}'`);
    }
    return module[member];
  };
  globalThis.__kotlinTestRun = (async () => {
    (await import("./my-module-js/my-module.mjs")).startUnitTests?.();
    await window.kotlinTestBrowserRunner.run();
  })();
</script>
</body>
</html>
