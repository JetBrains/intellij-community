rules {
  matcher {
    mnemonic: "^(IjPluginPackaging|JvmCompile|KotlinCompileWasmJs|KotlinLinkWasmJs)$"
  }
  transform {
    salt: "v1"

    # community: external/+jbr_toolchains+remotejbr25_<platform>/bin/<java_exe> to scrubbed_external_jbr_toolchains_remotejbr25_platform_bin_java_exe
    arg_replacements {
      source: "^external/\\+jbr_toolchains\\+remotejbr25_[^/]+/bin/java(\\.exe)?$"
      target: "scrubbed_external_jbr_toolchains_remotejbr25_platform_bin_java_exe"
    }

    # ultimate: external/community++jbr_toolchains+remotejbr25_<platform>/bin/<java_exe> to scrubbed_external_community_jbr_toolchains_remotejbr25_platform_bin_java_exe
    arg_replacements {
      source: "^external/community\\+\\+jbr_toolchains\\+remotejbr25_[^/]+/bin/java(\\.exe)?$"
      target: "scrubbed_external_community_jbr_toolchains_remotejbr25_platform_bin_java_exe"
    }
  }
}

# The actions of the dev-dist tools, see `dev_dist_tool` in `platform/build-scripts/bazel-rules/dev_dist_tool.bzl`. The
# binary of a tool differs on each host, and every tool gives equal bytes on every host. So the key omits the binary and
# the runfiles tree of the tool. A pattern of a file inside a runfiles tree omits nothing, so the pattern names the tree.
# Each action declares `<tool>.identity` as an input instead. It is equal on every host and changes when a build of the
# tool can change. The output directory of the host platform has one name on every host, see
# `--experimental_override_platform_cpu_name` in `community/common.bazelrc`.
rules {
  matcher {
    mnemonic: "^(DevDistEmbeddedProductDescriptor|DevDistFrontendApplicationInfo|DevDistPluginClasspathDescriptor|DevDistPluginDescriptor|DevDistProductApplicationInfo|DevDistProductDescriptor|DevDistProductFiles|DevDistRuntimeLayout|DevDistRuntimeLayoutPart|DevPluginSourceTreeArchive|GzipResources|PackContentModuleJar|PackDevPluginJar|PackDevPluginRemainder)$"
  }
  transform {
    salt: "dev-dist-v2"

    # bazel-out/<config>/bin/platform/build-scripts/bazel-rules/<tool>/<binary> and <binary>.runfiles in community, with
    # external/community+/ before platform/ in ultimate.
    omitted_inputs: "^bazel-out/[^/]+/bin/(external/community\\+/)?platform/build-scripts/bazel-rules/(content_module_packer/content-module-packer|plugin_descriptor_writer/plugin-descriptor-writer|plugin_remainder_packer/plugin-remainder-packer|product_files/product-files|runtime_layout/runtime-layout)(\\.exe)?(\\.runfiles)?$"

    # The path of the binary is the first argument. A Windows binary ends with `.exe`, and a replacement target is
    # literal, so each tool path becomes one name on every host and in both roots.
    arg_replacements {
      source: "^bazel-out/[^/]+/bin/(external/community\\+/)?platform/build-scripts/bazel-rules/content_module_packer/content-module-packer(\\.exe)?$"
      target: "dev-dist-tool-content-module-packer"
    }
    arg_replacements {
      source: "^bazel-out/[^/]+/bin/(external/community\\+/)?platform/build-scripts/bazel-rules/plugin_descriptor_writer/plugin-descriptor-writer(\\.exe)?$"
      target: "dev-dist-tool-plugin-descriptor-writer"
    }
    arg_replacements {
      source: "^bazel-out/[^/]+/bin/(external/community\\+/)?platform/build-scripts/bazel-rules/plugin_remainder_packer/plugin-remainder-packer(\\.exe)?$"
      target: "dev-dist-tool-plugin-remainder-packer"
    }
    arg_replacements {
      source: "^bazel-out/[^/]+/bin/(external/community\\+/)?platform/build-scripts/bazel-rules/product_files/product-files(\\.exe)?$"
      target: "dev-dist-tool-product-files"
    }
    arg_replacements {
      source: "^bazel-out/[^/]+/bin/(external/community\\+/)?platform/build-scripts/bazel-rules/runtime_layout/runtime-layout(\\.exe)?$"
      target: "dev-dist-tool-runtime-layout"
    }
  }
}
