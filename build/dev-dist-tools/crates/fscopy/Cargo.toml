# Inline rather than `.workspace = true`: the Air UI-lane workspace links this crate through a path dependency, and
# rules_rs reads the `[package]` and `[dependencies]` of such a crate without its workspace. Keep the values equal to
# `[workspace.package]` and `[workspace.dependencies]`.
[package]
name = "fscopy"
version = "0.1.0"
edition = "2024"
rust-version = "1.93"
publish = false
license = "Apache-2.0"

[lints]
workspace = true

[dev-dependencies]
tempfile.workspace = true
