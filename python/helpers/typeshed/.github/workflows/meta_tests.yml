# This workflow is for testing typeshed's scripts and tests themselves
name: Infrastructure tests

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:
    paths:
      - "scripts/**"
      - "tests/**"
      - "lib/**"
      - ".github/workflows/meta_tests.yml"
      - "requirements-tests.txt"
      - "pyproject.toml"

permissions:
  contents: read

env:
  PIP_DISABLE_PIP_VERSION_CHECK: 1
  FORCE_COLOR: 1

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  mypy:
    name: "mypy: type check"
    runs-on: ubuntu-latest
    strategy:
      matrix:
        platform: ["linux", "win32"]
      fail-fast: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
        with:
          version-file: "requirements-tests.txt"
      - name: Run check_typeshed_structure.py
        run: |
          uv run \
          --python=3.13 \
          --no-project \
          --with-requirements=requirements-tests.txt \
          ./tests/typecheck_typeshed.py \
          --platform=${{ matrix.platform }}

  pyright:
    name: "pyright: type check"
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-platform: ["Linux", "Windows"]
      fail-fast: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
        with:
          version-file: "requirements-tests.txt"
      - run: uv pip install -r requirements-tests.txt --system
      - name: Run pyright on typeshed
        uses: jakebailey/pyright-action@8ec14b5cfe41f26e5f41686a31eb6012758217ef # v3
        with:
          version: PATH
          python-platform: ${{ matrix.python-platform }}
          python-version: "3.10" # Oldest version supported for running scripts and tests
          project: ./pyrightconfig.scripts_and_tests.json

  stubsabot-dry-run:
    name: "stubsabot: dry run"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
        with:
          version-file: "requirements-tests.txt"
      - name: Git config
        run: |
          git config --global user.name stubsabot
          git config --global user.email '<>'
      - name: Run stubsabot
        run: |
          uv run \
          --python=3.13 \
          --no-project \
          --with-requirements=requirements-tests.txt \
          scripts/stubsabot.py \
          --action-level=local
