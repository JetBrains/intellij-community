[tox]
envlist = python3.8, python3.12, no_pandas_python3.8, no_pandas_python3.12
isolated_build = True
skipsdist = True

[testenv]
passenv = TEAMCITY_VERSION
setenv = PYTHONPATH = {toxinidir}/../..
changedir = {toxinidir}/../../pydev/pydev_tests_tables

[testenv:python3.8]
basepython = python3.8
deps =
  pytest
  pytest-mock
  teamcity-messages
  ipython
  numpy
  pandas<3.0.0
  tensorflow
  torch
  datasets
  polars==0.19.0
commands = pytest -s {toxinidir}/test_pycharm_tables_common.py {toxinidir}/test_pycharm_tables_pandas.py {toxinidir}/test_pycharm_tables_polars.py {toxinidir}/test_pycharm_tables_numpy_with_pandas.py {toxinidir}/test_pycharm_tables_tensorflow_with_pandas.py {toxinidir}/test_pycharm_tables_torch_with_pandas.py {toxinidir}/test_pycharm_tables_dataset.py

[testenv:python3.12]
basepython = python3.12
deps =
  pytest
  pytest-mock
  teamcity-messages
  ipython
  numpy
  pandas==3.0.0
  tensorflow
  torch
  datasets
  polars>=1.0.0
commands = pytest -s {toxinidir}/test_pycharm_tables_common.py {toxinidir}/test_pycharm_tables_pandas.py {toxinidir}/test_pycharm_tables_polars.py {toxinidir}/test_pycharm_tables_numpy_with_pandas.py {toxinidir}/test_pycharm_tables_tensorflow_with_pandas.py {toxinidir}/test_pycharm_tables_torch_with_pandas.py {toxinidir}/test_pycharm_tables_dataset.py

[testenv:no_pandas_python3.8]
basepython = python3.8
deps =
  pytest
  pytest-mock
  teamcity-messages
  ipython
  numpy
  tensorflow
  torch
commands = pytest -s {toxinidir}/test_pycharm_tables_numpy_without_pandas.py {toxinidir}/test_pycharm_tables_tensorflow_without_pandas.py {toxinidir}/test_pycharm_tables_torch_without_pandas.py

[testenv:no_pandas_python3.12]
basepython = python3.12
deps =
  pytest
  pytest-mock
  teamcity-messages
  ipython
  numpy
  tensorflow
  torch
commands = pytest -s {toxinidir}/test_pycharm_tables_numpy_without_pandas.py {toxinidir}/test_pycharm_tables_tensorflow_without_pandas.py {toxinidir}/test_pycharm_tables_torch_without_pandas.py
