<p>Reports a <code>patch()</code> target without a dot.</p>
<p><code>patch()</code> replaces an attribute of an object. A target without a dot has no parent object, so you cannot patch it.
  Patch an attribute of the module instead. For example, <code>patch("collections")</code> is invalid,
  but <code>patch("collections.OrderedDict")</code> is valid.</p>
