repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: 3e8a8703264a2f4a69428a0aa4dcb512790b2c8c # frozen: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-merge-conflict
      - id: mixed-line-ending
        args: [--fix=lf]
      - id: check-case-conflict
  - repo: https://github.com/python-jsonschema/check-jsonschema
    rev: 0494aa7fa1314e98913a41227d8f0a515b2c1049 # frozen: 0.38.2
    hooks:
      - id: check-github-workflows
      - id: check-renovate
        additional_dependencies: ["json5==0.15.0"]
  - repo: https://github.com/astral-sh/ruff-pre-commit
    # The Ruff version must match requirements-tests.txt.
    rev: 2eeb5678de71a00c0902cbda7105d328432f72cb # frozen: v0.16.8
    hooks:
      - id: ruff
        name: Run ruff on stubs, tests and scripts
        args: ["--exit-non-zero-on-fix"]
      - id: ruff
        # Very few rules are useful to run on our test cases;
        # we explicitly enumerate them here:
        name: Run ruff on the test cases
        args:
          - "--exit-non-zero-on-fix"
          - "--select=FA,I,ICN001,RUF100"
          - "--no-force-exclude"
          - "--unsafe-fixes"
        files: '.*test_cases/.+\.py$'
  - repo: https://github.com/psf/black-pre-commit-mirror
    rev: 4160603246a6b365d4a2af661c6d71b0a0f50478 # frozen: 26.5.1
    hooks:
      - id: black
  - repo: https://github.com/pycqa/flake8
    rev: 7eccf20b526fe4f2230bf9afeeef2fc9f97faf8d # frozen: 7.4.1
    hooks:
      - id: flake8
        language: python
        additional_dependencies:
          - "flake8-pyi==26.5.0"
        types: [file]
        types_or: [python, pyi]
  - repo: meta
    hooks:
      - id: check-hooks-apply
  # zizmor detects security vulnerabilities in GitHub Actions workflows.
  - repo: https://github.com/zizmorcore/zizmor-pre-commit
    rev: fa412071e4f5d44d44f9e365f4676f9df92456a2 # frozen: v1.30.1
    hooks:
      - id: zizmor
        args: [--no-progress, --fix]

ci:
  autofix_commit_msg: "[pre-commit.ci] auto fixes from pre-commit.com hooks"
  autofix_prs: true
  autoupdate_commit_msg: "[pre-commit.ci] pre-commit autoupdate"
  autoupdate_schedule: quarterly
  submodules: false
