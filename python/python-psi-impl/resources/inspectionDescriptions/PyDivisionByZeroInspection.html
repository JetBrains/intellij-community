<body>
<p>Reports division operations (<code>/</code>, <code>//</code>, <code>%</code>, <code>divmod()</code>)
  where the divisor is always zero,
  which raises an error at runtime, for example <code>ZeroDivisionError</code>.</p>
<p><b>Example:</b></p>
<pre><code>
result = x / 0
</code></pre>
<p>As a fix, correct the divisor so that it cannot be zero.</p>
</body>
</html>
