[project]
name = "sub-project-a"
version = "0.1.0"
description = "Sub-project A"
requires-python = ">=3.12"
dependencies = []

# The sibling member is declared as an extra only: nothing lists it in `[project].dependencies`.
[project.optional-dependencies]
tools = [
  "sub-project-b",
]

[tool.uv.sources]
sub-project-b = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sub_project_a"]
