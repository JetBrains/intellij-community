[project]
name = "pythonproject"
version = "0.1.0"
description = "Root project"
requires-python = ">=3.12"
dependencies = [
    "sub-project-a",
    "sub-project-b",
]

[tool.uv]
workspace = { members = ["sub-projects/*"] }

[tool.uv.sources]
sub-project-a = [
    { workspace = true, marker = "sys_platform == 'linux'" },
    { workspace = true, marker = "sys_platform == 'win32'" },
]
sub-project-b = [
    { workspace = true, marker = "sys_platform == 'linux'" },
    { workspace = true, marker = "sys_platform == 'win32'" },
]
