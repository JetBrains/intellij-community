[project]
name = "typeshed-docstrings"
version = "0"
description = "Adds runtime docstrings of compiled definitions to the bundled typeshed stdlib"
requires-python = ">=3.10"
dependencies = [
    # The version of the black hook in typeshed/.pre-commit-config.yaml, so that black changes only the new docstrings.
    "black==26.5.1",
    "docstring-adder",
]

[tool.uv]
package = false

[tool.uv.sources]
docstring-adder = { git = "https://github.com/astral-sh/docstring-adder", rev = "877f03424044cbefa92cf220f5f565873e6ed4be" }
